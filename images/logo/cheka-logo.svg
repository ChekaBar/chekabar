<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="Cheka — Bar Café — Luggage Storage">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFE5CF"/>
      <stop offset="1" stop-color="#C49A5A"/>
    </linearGradient>
  </defs>

  <!-- coffee cup + leaf mark -->
  <g fill="none" stroke="#C49A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 54 h44 v20 a22 22 0 0 1 -22 22 h0 a22 22 0 0 1 -22 -22 Z"/>
    <path d="M84 60 h10 a10 10 0 0 1 0 20 h-6"/>
    <path d="M62 30 c 10 6 10 16 0 24 c -10 -8 -10 -18 0 -24 Z" fill="#7E963F" stroke="#7E963F"/>
    <path d="M62 42 v14" stroke="#1B3523" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="118" y="70" font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="52" font-weight="600" letter-spacing="2" fill="url(#wordmark)">Cheka</text>

  <!-- sub-lines -->
  <text x="120" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13"
        letter-spacing="6" fill="#EFE5CF">BAR • CAFÉ</text>
  <text x="120" y="116" font-family="Arial, Helvetica, sans-serif" font-size="11"
        letter-spacing="4" fill="#9DB07A">LUGGAGE STORAGE</text>
</svg>
